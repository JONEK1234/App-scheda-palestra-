<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#1f0709" />
      <stop offset="60%" stop-color="#0a0a0c" />
      <stop offset="100%" stop-color="#050507" />
    </radialGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff334b" />
      <stop offset="50%" stop-color="#e11d48" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>
    <linearGradient id="steelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f4f4f5" />
      <stop offset="50%" stop-color="#a1a1aa" />
      <stop offset="100%" stop-color="#52525b" />
    </linearGradient>
    <linearGradient id="plateDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#27272a" />
      <stop offset="50%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#0f0f11" />
    </linearGradient>
    <filter id="redNeonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="url(#bgGlow)" />
  <rect width="504" height="504" x="4" y="4" rx="96" fill="none" stroke="url(#redGrad)" stroke-width="3" stroke-opacity="0.35" />

  <!-- Hexagonal decorative ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#27272a" stroke-width="4" stroke-dasharray="12 16" opacity="0.6" />
  <circle cx="256" cy="256" r="176" fill="none" stroke="url(#redGrad)" stroke-width="2" opacity="0.4" />

  <!-- Gym Barbell & Dumbbells Graphic Centered -->
  <g transform="translate(0, 0)">
    <!-- Central Barbell shaft -->
    <rect x="110" y="242" width="292" height="28" rx="6" fill="url(#steelGrad)" />
    <!-- Grip knurling details on bar -->
    <rect x="180" y="245" width="60" height="22" rx="3" fill="#27272a" opacity="0.8" />
    <rect x="272" y="245" width="60" height="22" rx="3" fill="#27272a" opacity="0.8" />
    <!-- Knurl texture lines -->
    <line x1="195" y1="245" x2="195" y2="267" stroke="#71717a" stroke-width="2" />
    <line x1="210" y1="245" x2="210" y2="267" stroke="#71717a" stroke-width="2" />
    <line x1="225" y1="245" x2="225" y2="267" stroke="#71717a" stroke-width="2" />
    <line x1="287" y1="245" x2="287" y2="267" stroke="#71717a" stroke-width="2" />
    <line x1="302" y1="245" x2="302" y2="267" stroke="#71717a" stroke-width="2" />
    <line x1="317" y1="245" x2="317" y2="267" stroke="#71717a" stroke-width="2" />

    <!-- Center Ring Accent -->
    <circle cx="256" cy="256" r="8" fill="url(#redGrad)" filter="url(#redNeonGlow)" />

    <!-- Outer Collars -->
    <rect x="160" y="234" width="14" height="44" rx="4" fill="url(#steelGrad)" />
    <rect x="338" y="234" width="14" height="44" rx="4" fill="url(#steelGrad)" />

    <!-- Left Weight Plates (Layered 3D Gym Plates) -->
    <!-- Large plate -->
    <rect x="130" y="160" width="22" height="192" rx="7" fill="url(#plateDark)" stroke="#3f3f46" stroke-width="3" />
    <rect x="135" y="174" width="12" height="164" rx="4" fill="url(#redGrad)" />

    <!-- Middle plate -->
    <rect x="100" y="184" width="22" height="144" rx="6" fill="url(#plateDark)" stroke="#3f3f46" stroke-width="2.5" />
    <line x1="111" y1="196" x2="111" y2="316" stroke="url(#redGrad)" stroke-width="3" />

    <!-- Small outer plate -->
    <rect x="74" y="206" width="20" height="100" rx="5" fill="url(#plateDark)" stroke="#3f3f46" stroke-width="2" />
    <rect x="80" y="218" width="8" height="76" rx="2" fill="#52525b" />

    <!-- Bar Tip Left -->
    <rect x="62" y="248" width="12" height="16" rx="3" fill="url(#steelGrad)" />

    <!-- Right Weight Plates (Layered 3D Gym Plates) -->
    <!-- Large plate -->
    <rect x="360" y="160" width="22" height="192" rx="7" fill="url(#plateDark)" stroke="#3f3f46" stroke-width="3" />
    <rect x="365" y="174" width="12" height="164" rx="4" fill="url(#redGrad)" />

    <!-- Middle plate -->
    <rect x="390" y="184" width="22" height="144" rx="6" fill="url(#plateDark)" stroke="#3f3f46" stroke-width="2.5" />
    <line x1="401" y1="196" x2="401" y2="316" stroke="url(#redGrad)" stroke-width="3" />

    <!-- Small outer plate -->
    <rect x="418" y="206" width="20" height="100" rx="5" fill="url(#plateDark)" stroke="#3f3f46" stroke-width="2" />
    <rect x="424" y="218" width="8" height="76" rx="2" fill="#52525b" />

    <!-- Bar Tip Right -->
    <rect x="438" y="248" width="12" height="16" rx="3" fill="url(#steelGrad)" />

    <!-- Dynamic Speed/Power Wings / Accent Chevron -->
    <path d="M 230 145 L 256 125 L 282 145" fill="none" stroke="url(#redGrad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" filter="url(#redNeonGlow)" />
    <path d="M 238 165 L 256 150 L 274 165" fill="none" stroke="#f43f5e" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0.8" />

    <!-- Brand Typography Subtitle -->
    <text x="256" y="390" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="28" letter-spacing="6" fill="#ffffff">IRON ROUTINE</text>
    <text x="256" y="416" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="13" letter-spacing="4" fill="#ef4444">PALESTRA 3-DAY SPLIT</text>
  </g>
</svg>
